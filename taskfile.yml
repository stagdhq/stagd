# Tasks for the stagd CLI and relay. Task is pinned in go.mod, so `go tool
# task <name>` works with nothing but Go installed. `go tool task --list`
# shows them all.
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build bin/stagd
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/stagd ./cmd/stagd

  generate:
    desc: Regenerate internal/gen from proto/ (needs buf)
    sources:
      - proto/**/*.proto
      - proto/buf.yaml
      - proto/buf.gen.yaml
      - internal/configschema/**/*.go
    cmds:
      - buf generate --template proto/buf.gen.yaml

  lint:
    desc: Lint and format-check the protos
    cmds:
      - buf lint proto
      - buf format proto -d --exit-code

  fmt:
    desc: Format Go and the protos
    cmds:
      - gofmt -w cmd internal
      - buf format proto -w

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  check:
    desc: "What CI runs: protos, formatting, vet, tests"
    deps: [lint]
    cmds:
      - cmd: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo "run: task fmt"; exit 1; fi
      - go vet ./...
      - go test ./...

  dist:
    desc: "Release files into dist/: stagd for macOS, Linux and Windows (amd64, arm64), install.sh, install.ps1, checksums.txt"
    cmds:
      - rm -rf dist && mkdir -p dist
      - |
        for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
          os=${target%/*}
          arch=${target#*/}
          dir=$(mktemp -d)
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "{{.LDFLAGS}}" -o "$dir/stagd" ./cmd/stagd
          cp LICENSE README.md "$dir/"
          tar -czf "dist/stagd_${os}_${arch}.tar.gz" -C "$dir" stagd LICENSE README.md
          rm -rf "$dir"
        done
      - |
        for arch in amd64 arm64; do
          dir=$(mktemp -d)
          CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "{{.LDFLAGS}}" -o "$dir/stagd.exe" ./cmd/stagd
          cp LICENSE README.md "$dir/"
          zip -q -j "dist/stagd_windows_${arch}.zip" "$dir/stagd.exe" "$dir/LICENSE" "$dir/README.md"
          rm -rf "$dir"
        done
      - cp install.sh install.ps1 dist/
      - cd dist && if command -v sha256sum >/dev/null; then sha256sum *; else shasum -a 256 *; fi | grep -v checksums.txt > checksums.txt

  image:
    desc: "Build the stagd image for this machine, as stagd:local (CI publishes ghcr.io/stagdhq/stagd)"
    cmds:
      - docker buildx build --load --build-arg VERSION={{.VERSION}} -t stagd:local .

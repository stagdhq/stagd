# The relay: connects the cluster to Stagd from the inside, so neither the
# API server nor an ingress needs to be reachable. It runs as Stagd's
# service account (stagd-access.yaml), with Stagd's URL and the connection's
# relay token in the stagd-relay secret. All of it comes with
#
#   stagd compute install <connection> | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagd-relay
  namespace: stagd-system
  labels:
    app.kubernetes.io/name: stagd-relay
spec:
  # One relay per connection: a second one would take over from the first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stagd-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stagd-relay
    spec:
      serviceAccountName: stagd
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/stagdhq/stagd:0.2.0
          # :8081 takes preview traffic from the Cloudflare Tunnel (stagd-tunnel.yaml), when there is one.
          args: [relay, --log-format=json, --http=:8081]
          ports:
            - {name: tunnel, containerPort: 8081}
          env:
            - name: STAGD_URL
              valueFrom:
                secretKeyRef: {name: stagd-relay, key: url}
            - name: STAGD_RELAY_TOKEN
              valueFrom:
                secretKeyRef: {name: stagd-relay, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}

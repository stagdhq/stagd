version: 1

app:
  compose: ./deploy/compose.preview.yaml

ingress:
  web: { service: web, port: 3000, primary: true }
  api: { service: api, port: 8080 }

build:
  web: { context: ., dockerfile: Dockerfile, target: prod, args: { NODE_ENV: production } }
  api: { image: ghcr.io/acme/api }
  worker: { image: "ghcr.io/acme/worker:sha-${STAGD_SHA}", wait: 20m }

wait:
  checks: [build-images, " tests "]
  timeout: 45m

registries:
  ghcr.io: { username: acme-bot, password: "${GHCR_TOKEN}" }

services:
  mail: {}
  otel:
    export:
      endpoint: https://otlp.example.com
      protocol: grpc
      headers: { Authorization: "Bearer ${DASH0_TOKEN}" }
    ignore: [/healthz, /internal/*]
  postgres:
    version: "16"
    seed: "https://seeds.example.com/app.dump?${SEED_TOKEN}"

database:
  neon:
    project: billowing-sound-61277569
    parent: br-broad-heart-a2qzljrk
    env: { url: SQL_URL, unpooled: SQL_UNPOOLED_URL }

env:
  ENVIRONMENT_TAG: pr-${STAGD_PR_NUMBER}
  WORKERS: 4

previews: on-demand
comment: "Sign in with code 123456."
compute: " kind "

lifecycle:
  sleep_after: 2h
  expire_after: 36h

commands: { handled: collapse }

syntax = "proto3";

package stagd.config.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// Config is a repository's stagd.yaml, as Stagd reads it: the optional file
// at the repository's root that says where the app is described and what
// Stagd adds on top.
//
// The messages have stagd.yaml's own shape: a message's JSON (protojson,
// with the proto field names) is the file in its plain form. A file may also
// use a few shorthands, which read as their plain form:
//
//   previews: always           previews: { when: always }
//   services: { mail: true }   services: { mail: {} }
//   mail: false (or otel)      left out
//
// A reader fills in the defaults, e.g. a Neon database's name, and gives
// durations as protojson's ("1200s" for 20m). Who may open previews is never
// set here: a pull request mustn't be able to loosen its own preview's
// access by editing a file. That's set in Stagd.
//
// stagd/config/v1/testdata in the stagd repository holds files with how
// they read, or the problems they have: every reader runs them.
message Config {
  // The file's format: 1, the only one so far.
  int32 version = 1 [(buf.validate.field).int32.const = 1];

  // Where the app is described.
  App app = 2;

  // The preview's URLs by name, e.g. web: { service: web, port: 3000 }. When
  // set, it replaces the dev.stagd.* labels in the compose file.
  map<string, Ingress> ingress = 3 [(buf.validate.field).map.keys.string.pattern = "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"];

  // Where each service's image comes from, by the compose file's service name.
  map<string, Build> build = 4;

  // What Stagd runs next to the app.
  Services services = 5;

  // Variables the compose file can use, like compose's .env file. Values
  // may use Stagd's variables and secrets, ${STAGD_PR_NUMBER} or
  // ${SESSION_SECRET}; a secret wins over a variable of the same name.
  map<string, string> env = 6 [(buf.validate.field).map.keys.string.pattern = "^[A-Za-z_][A-Za-z0-9_]*$"];

  // The preview's own database.
  Database database = 7;

  // When pull requests get previews: when someone asks with /stagd deploy
  // (on-demand, the default), always, or while they have a label.
  Previews previews = 8;

  // Added to the pull request comment once the preview is live, e.g. how to
  // sign in. Markdown.
  string comment = 9 [(buf.validate.field).string.max_bytes = 4000];

  // What happens to /stagd commands.
  Commands commands = 10;

  // GitHub checks on the commit that must pass before it deploys, e.g. the
  // workflow that pushes the images.
  Wait wait = 11;

  // Logins for pulling private images, by the registry's host, e.g. ghcr.io.
  map<string, Registry> registries = 12 [(buf.validate.field).map.keys.string.pattern = "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$"];

  // How long previews stay awake and live, in place of the org's setting.
  Lifecycle lifecycle = 13;

  // The compute connection previews run on, by its name on Settings →
  // Compute, e.g. kind. Left out, the org's default.
  string compute = 14;
}

// Where the app is described: a compose file only, for now (Helm, Kustomize
// and manifests come later).
message App {
  // The compose file's path in the repository, e.g. deploy/compose.yaml.
  // Left out, compose.yaml (or compose.yml, docker-compose.yaml…) at the root.
  string compose = 1;
}

// One of the preview's URLs: a service's port.
message Ingress {
  // The compose file's service.
  string service = 1 [(buf.validate.field).string.min_len = 1];

  int32 port = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];

  // The URL the pull request comment and the dashboard link to first.
  bool primary = 3;
}

// A service's image: built from the repository, or one built elsewhere.
message Build {
  oneof source {
    option (buf.validate.oneof).required = true;

    // Built from this directory in the repository, e.g. "." or services/api.
    string context = 1;

    // Pulled as it is, e.g. ghcr.io/acme/api:${STAGD_SHA}: pushed by CI.
    string image = 2;
  }

  // With context: the Dockerfile's path, from the context.
  string dockerfile = 3;

  // With context: the Dockerfile's stage to build.
  string target = 4;

  // With context: build arguments.
  map<string, string> args = 5;

  // With image: how long to keep trying to pull it, as CI may push it after
  // the deploy starts; between 1m and 2h. Left out, a missing image fails
  // the deploy at once.
  google.protobuf.Duration wait = 6 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 7200}
  }];
}

// What Stagd runs next to the app.
message Services {
  // Captures the mail the app sends (Mailpit), for the dashboard and the
  // preview's own inbox.
  Mail mail = 1;

  // An OpenTelemetry endpoint for the app's traces, with a viewer (Jaeger).
  OTel otel = 2;

  // A Postgres database for the preview, started from a seed when there is
  // one. The app gets its URL in DATABASE_URL.
  Postgres postgres = 3;
}

message Mail {}

message Postgres {
  // The major version: 16, 17, 18 (the default) or 19. A seed made with a newer
  // pg_dump than this doesn't restore.
  string version = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "16",
        "17",
        "18",
        "19"
      ]
    }
  ];

  // The database the app uses: postgres when left out.
  string database = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"
  ];

  // What the database starts with, a pg_dump (plain SQL, custom or tar
  // format, compressed with gzip or zstd or not): a seed's name, as on the
  // org's Seeds page, whose file is in a blob store the org's integrations
  // reach; or an https URL, which may use variables and secrets, e.g.
  // https://example.com/seed.dump?${SEED_TOKEN}. Restored once, when the
  // preview is made; redeploys keep the data.
  string seed = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^(https://.*|[a-z0-9]([a-z0-9-]*[a-z0-9])?)$"
  ];
}

message OTel {
  // Where a copy of what the app sends goes on to: the team's own backend.
  OTelExport export = 1;

  // Request paths whose traces aren't kept, a * matching the rest, e.g.
  // [/healthz, /internal/*].
  repeated string ignore = 2 [(buf.validate.field).repeated.items.string.pattern = "^/[^ ?#]*$"];
}

message OTelExport {
  // An OTLP endpoint, e.g. https://otlp.example.com.
  string endpoint = 1 [(buf.validate.field).string.min_len = 1];

  // How it's sent: http/protobuf (the default) or grpc.
  string protocol = 2 [(buf.validate.field).string = {
    in: [
      "http/protobuf",
      "grpc"
    ]
  }];

  // Headers sent with it, e.g. Authorization: "Bearer ${DASH0_TOKEN}".
  map<string, string> headers = 3;
}

// The preview's own database.
message Database {
  // A branch of a Neon database, forked for each preview.
  Neon neon = 1;
}

// A Neon branch per preview, forked from a parent branch. Which parents may
// be forked is the org's Neon integration's to say: a pull request that
// could name any parent could fork production into its preview.
message Neon {
  // Which of the org's Neon integrations, when it has several.
  string integration = 1;

  string project = 2 [(buf.validate.field).string.min_len = 1];

  // The branch to fork: its id or name.
  string parent = 3 [(buf.validate.field).string.min_len = 1];

  // The database, neondb by default.
  string database = 4;

  // The role the URLs sign in as, neondb_owner by default.
  string role = 5;

  // Whether url is the pooled URL.
  bool pooled = 6;

  // Added to the URLs, e.g. sslmode: verify-full.
  map<string, string> params = 7;

  // The variables the URLs are given as, by kind: url (pooled or not, as
  // pooled says), pooled and unpooled. By default url: DATABASE_URL.
  map<string, string> env = 8 [(buf.validate.field).map.keys.string = {
    in: [
      "url",
      "pooled",
      "unpooled"
    ]
  }];
}

// When pull requests get previews.
message Previews {
  oneof previews {
    // on-demand, when someone asks with /stagd deploy; or always.
    string when = 1 [(buf.validate.field).string = {
      in: [
        "on-demand",
        "always"
      ]
    }];

    // A GitHub label: adding it deploys the preview, removing it tears the
    // preview down.
    string label = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 50
    }];
  }
}

message Commands {
  // What happens to a /stagd comment once it's handled: delete (the
  // default), collapse or keep.
  string handled = 1 [(buf.validate.field).string = {
    in: [
      "delete",
      "collapse",
      "keep"
    ]
  }];
}

message Wait {
  // Check run or workflow names, e.g. [build-images]; one failing fails the
  // preview at once.
  repeated string checks = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
  }];

  // How long to wait for them, from when the deploy starts: 30m by default,
  // 1m to 2h.
  google.protobuf.Duration timeout = 2 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 7200}
  }];
}

// A login for pulling images from one registry.
message Registry {
  string username = 1 [(buf.validate.field).string.min_len = 1];

  // A secret of Stagd's, written as "${NAME}": a password in the repository
  // is a leaked password.
  string password = 2 [(buf.validate.field).string.pattern = "\\$\\{"];
}

// How long previews stay awake and live, in place of the org's setting.
message Lifecycle {
  // How long a preview nobody opens stays awake: 45m to 24h.
  google.protobuf.Duration sleep_after = 1 [(buf.validate.field).duration = {
    gte: {seconds: 2700}
    lte: {seconds: 86400}
  }];

  // How long a preview lives without a new commit: 1h to 48h.
  google.protobuf.Duration expire_after = 2 [(buf.validate.field).duration = {
    gte: {seconds: 3600}
    lte: {seconds: 172800}
  }];
}

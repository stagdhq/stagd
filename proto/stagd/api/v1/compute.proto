syntax = "proto3";

package stagd.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "stagd/api/v1/activity.proto";
import "stagd/api/v1/model.proto";

// ComputeService connects the compute that previews run on to the active
// org. Previews run on the customer's own compute; Stagd only orchestrates.
//
// Compute is pluggable: every provider (Namespace first, then Fly.io, Azure
// Container Apps, Kubernetes, Unikraft Cloud, and later Stagd-managed
// compute) sits behind the same interface. ListProviders describes each
// provider's credential and setting fields, so clients build their connect
// forms from it instead of knowing providers themselves.
service ComputeService {
  // ListProviders lists the compute providers this Stagd server supports.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // CreateConnection checks the credentials with the provider and, if they
  // work, saves them (encrypted) as a connection of the active org.
  rpc CreateComputeConnection(CreateComputeConnectionRequest) returns (CreateComputeConnectionResponse);
  rpc ListComputeConnections(ListComputeConnectionsRequest) returns (ListComputeConnectionsResponse);
  // TestConnection checks a saved connection's credentials again.
  rpc TestComputeConnection(TestComputeConnectionRequest) returns (TestComputeConnectionResponse);
  // UpdateConnection changes a connection's fields, e.g. a new token, and
  // checks the result with the provider before saving it. A secret not given
  // stays as it was.
  rpc UpdateComputeConnection(UpdateComputeConnectionRequest) returns (UpdateComputeConnectionResponse);
  // SetDefaultConnection makes a connection the one new previews run on.
  rpc SetDefaultComputeConnection(SetDefaultComputeConnectionRequest) returns (SetDefaultComputeConnectionResponse);
  // DeleteConnection forgets a connection and its credentials.
  rpc DeleteComputeConnection(DeleteComputeConnectionRequest) returns (DeleteComputeConnectionResponse);
  // CreateRelayInstall gives a relay connection a new relay token: the old
  // one stops working, and a relay using it is cut off. For a Docker host's
  // relay (and cloudflared, with its tunnel's token); Kubernetes uses
  // CreateInstallManifest.
  rpc CreateRelayInstall(CreateRelayInstallRequest) returns (CreateRelayInstallResponse);
  // CreateInstallManifest is everything a Kubernetes connection's cluster
  // needs, as one manifest for `kubectl apply -f -`: Stagd's access, the
  // relay with a new token (the old one stops working), and what the
  // connection chooses (the builder, the Cloudflare Tunnel with its token).
  // The tokens are in the manifest and nowhere else.
  rpc CreateInstallManifest(CreateInstallManifestRequest) returns (CreateInstallManifestResponse);
  // GetComputeConnectionDetails is everything Stagd can tell about one
  // connection, asked for now: its relay and tunnel as they are, what the
  // compute says about itself, and what's been done to it. Slower than
  // ListComputeConnections, which answers from what Stagd keeps.
  rpc GetComputeConnectionDetails(GetComputeConnectionDetailsRequest) returns (GetComputeConnectionDetailsResponse);
}

enum ComputeProvider {
  COMPUTE_PROVIDER_UNSPECIFIED = 0;
  // A stand-in that runs nothing; local development and tests only.
  COMPUTE_PROVIDER_FAKE = 1;
  COMPUTE_PROVIDER_NAMESPACE = 2;
  // Planned.
  COMPUTE_PROVIDER_FLY = 3;
  // Planned.
  COMPUTE_PROVIDER_AZURE_CONTAINER_APPS = 4;
  // Any cluster, directly or through stagd relay.
  COMPUTE_PROVIDER_KUBERNETES = 5;
  // Planned.
  COMPUTE_PROVIDER_UNIKRAFT = 6;
  // A Docker host, through stagd relay.
  COMPUTE_PROVIDER_DOCKER = 7;
}

// ComputeCapabilities says what a provider can do. Stagd works around what it
// can't: without sleep, a sleeping preview is destroyed and recreated on wake;
// without volume snapshots, data is seeded on every create.
message ComputeCapabilities {
  // Instances can be stopped and resumed.
  bool sleep = 1;
  // A volume can be snapshotted once and restored into new instances.
  bool volume_snapshots = 2;
  // Where instances can run, e.g. "eu", "us".
  repeated string regions = 3;
  // The longest an instance can live; unset when there is no limit.
  google.protobuf.Duration max_lifetime = 4;
}

// ProviderField is one value a provider needs to connect, e.g. an API token
// or a region.
message ProviderField {
  string key = 1;
  string label = 2;
  // How to get or choose the value.
  string help = 3;
  // Secret values are encrypted at rest and never returned by the API.
  bool secret = 4;
  bool required = 5;
  // When set, the value must be one of these.
  repeated string choices = 6;
}

message ProviderInfo {
  ComputeProvider provider = 1;
  string name = 2;
  string description = 3;
  repeated ProviderField fields = 4;
  ComputeCapabilities capabilities = 5;
}

enum ComputeConnectionStatus {
  COMPUTE_CONNECTION_STATUS_UNSPECIFIED = 0;
  // The last check worked.
  COMPUTE_CONNECTION_STATUS_ACTIVE = 1;
  // The last check failed; see status_message.
  COMPUTE_CONNECTION_STATUS_FAILING = 2;
}

// ComputeConnection is one compute account linked to an org.
message ComputeConnection {
  string id = 1;
  ComputeProvider provider = 2;
  // A name chosen by the org, e.g. "namespace-eu". Unique in the org.
  string name = 3;
  // The non-secret field values, e.g. {"region": "eu"}.
  map<string, string> settings = 4;
  // What the provider reported about the account when last checked, e.g.
  // the workspace name.
  string account = 5;
  ComputeConnectionStatus status = 6;
  string status_message = 7;
  ComputeCapabilities capabilities = 8;
  // New previews run on the default connection.
  bool default = 9;
  User created_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp check_time = 12;
  // Set when the connection's previews are reached through a Cloudflare
  // Tunnel Stagd made for the cluster (Kubernetes, settings "previews").
  StagdTunnel tunnel = 14;
  // Never set: Stagd's own ingress in clusters was replaced by the tunnel.
  StagdIngress ingress = 13 [deprecated = true];
  // For a connection through `stagd relay`, while its relay is connected:
  // its release, and whether there's a newer one.
  StagdRelay relay = 15;
}

// A connection's relay, as it said when it connected.
message StagdRelay {
  // The relay's release, e.g. "v0.4.1"; for a build that isn't a release,
  // what it calls itself, e.g. "v0.4.1-3-g1a2b3c4" or "dev".
  string version = 1;
  google.protobuf.Timestamp connect_time = 2;
  // The newest release, e.g. "v0.5.0", when it's newer than the relay's;
  // empty when the relay is up to date, isn't a release, or Stagd can't
  // tell. The connection's install command updates it.
  string latest_version = 3;
  // Whether it should be updated rather than may be: a minor release or more
  // behind, e.g. v0.4.1 with v0.5.0 out, not v0.5.0 with v0.5.1.
  bool update_recommended = 4;
  // Where it connects from: the address Stagd sees, and the Cloudflare
  // location it reached, e.g. "CPH". Only in GetComputeConnectionDetails.
  string remote_address = 5;
  string location = 6;
  // A ping's round trip over its connection, from Stagd to the relay and
  // back. Only in GetComputeConnectionDetails; unset when it didn't answer.
  google.protobuf.Duration round_trip = 7;
}

// Unused: Stagd's own ingress in clusters, replaced by StagdTunnel.
message StagdIngress {
  option deprecated = true;

  string host = 1;
  string address = 2;
  google.protobuf.Timestamp certificate_expire_time = 3;
  string problem = 4;
  google.protobuf.Timestamp check_time = 5;
}

// The Cloudflare Tunnel Stagd made for a cluster (deploy/kubernetes/stagd-tunnel.yaml),
// as Stagd last found it.
message StagdTunnel {
  // The tunnel's host name, e.g. "tunnel-0f3a9c2e81d4.stagd.run": Stagd's
  // edge sends preview requests there; visitors never see it.
  string host = 1;
  // The Cloudflare locations its connectors are at, e.g. "cph01"; empty
  // while none is connected.
  repeated string locations = 2;
  // What stops previews being reached through it, e.g. "waiting for
  // cloudflared in the cluster to connect"; empty when they are.
  string problem = 3;
  // When Stagd last looked; unset before it has.
  google.protobuf.Timestamp check_time = 4;
  // Its connectors as Cloudflare has them now. Only in
  // GetComputeConnectionDetails.
  repeated TunnelConnector connectors = 5;
}

// One connection from cloudflared next to the relay to Cloudflare; each
// cloudflared keeps several, at nearby locations.
message TunnelConnector {
  // The Cloudflare location, e.g. "cph01".
  string location = 1;
  // cloudflared's release, e.g. "2026.9.1".
  string version = 2;
  // The address it connects from, as Cloudflare sees it.
  string origin_address = 3;
  google.protobuf.Timestamp open_time = 4;
}

// ComputeFact is one thing the compute says about itself, e.g. {"CPUs",
// "8"}, in the provider's own terms, to show as it is.
message ComputeFact {
  string label = 1;
  string value = 2;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

message CreateComputeConnectionRequest {
  ComputeProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
  }];
  // Every field the provider lists, by key: secret and non-secret alike.
  map<string, string> values = 3;
}

message CreateComputeConnectionResponse {
  ComputeConnection connection = 1;
  // For a connection through `stagd relay`: the token the relay connects
  // with. Only ever shown here; Stagd keeps a hash.
  string relay_token = 2;
  // Never set: a Kubernetes cluster's install is CreateInstallManifest's
  // manifest, piped to kubectl, not a link.
  string relay_install_url = 3 [deprecated = true];
  google.protobuf.Timestamp relay_install_expire_time = 4 [deprecated = true];
  // For a Docker host, when Stagd reaches previews through a Cloudflare
  // Tunnel of the connection's own: what cloudflared runs it with, next to
  // the relay (stagd compute connect docker --run). Only ever shown here.
  string tunnel_token = 5;
}

message ListComputeConnectionsRequest {}

message ListComputeConnectionsResponse {
  repeated ComputeConnection connections = 1;
}

message TestComputeConnectionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message TestComputeConnectionResponse {
  ComputeConnection connection = 1;
}

message UpdateComputeConnectionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Only the fields to change, by key.
  map<string, string> values = 2;
}

message UpdateComputeConnectionResponse {
  ComputeConnection connection = 1;
}

message SetDefaultComputeConnectionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message SetDefaultComputeConnectionResponse {
  ComputeConnection connection = 1;
}

message DeleteComputeConnectionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteComputeConnectionResponse {}

message CreateRelayInstallRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CreateRelayInstallResponse {
  // The new token the relay connects with. Only ever shown here.
  string relay_token = 1;
  // Never set: Kubernetes uses CreateInstallManifest.
  string relay_install_url = 2 [deprecated = true];
  google.protobuf.Timestamp relay_install_expire_time = 3 [deprecated = true];
  // When Stagd reaches the Docker host's previews through a Cloudflare Tunnel
  // of the connection's own: what cloudflared runs it with, next to the
  // relay (stagd compute install --run). Only ever shown here.
  string tunnel_token = 4;
}

message CreateInstallManifestRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CreateInstallManifestResponse {
  // Multi-document YAML, for `kubectl apply -f -`. It holds the new relay
  // token (and the tunnel's): print it, pipe it, don't keep it around.
  string manifest = 1;
}

message GetComputeConnectionDetailsRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetComputeConnectionDetailsResponse {
  // With its relay and tunnel asked for now, so with their details.
  ComputeConnection connection = 1;
  // What the compute says about itself, e.g. a Docker host's CPUs, memory
  // and engine, or a cluster's version and nodes; empty when it can't be
  // asked.
  repeated ComputeFact facts = 2;
  // Why there are no facts, or not all of them, e.g. "the relay isn't
  // connected"; empty when there's nothing missing.
  string facts_problem = 3;
  // What's been done to the connection, newest first: made, changed, new
  // relay tokens. At most 20.
  repeated Activity activity = 4;
}

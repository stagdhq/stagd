syntax = "proto3";

package stagd.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ActivityService is the org's activity log: who changed what its previews
// depend on (secrets, compute, integrations, access), and when. It never
// holds a secret's value.
service ActivityService {
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
}

message Activity {
  string id = 1;
  google.protobuf.Timestamp create_time = 2;
  // Who, by email; empty for Stagd itself.
  string actor = 3;
  // How: "web", "cli", "stagd", "relay", or "github" for what someone did on
  // GitHub (detail "by" holds their login).
  string via = 4;
  // What happened, "<kind>.<what happened>": e.g. "secret.set",
  // "compute.default_set". Every one is listed in the platform's
  // docs/activity.md.
  string action = 5;
  // What it happened to, in words.
  string target = 6;
  map<string, string> detail = 7;
}

message ListActivityRequest {
  // At most this many, newest first; 50 when unset.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  // The next_page_token of the page before, asked with the same filters.
  string page_token = 2;
  // Only this area, empty for all: "secrets", "seeds", "compute",
  // "integrations", "repositories", "github", "members" or "workspace".
  string area = 3 [(buf.validate.field).string = {
    in: [
      "",
      "secrets",
      "seeds",
      "compute",
      "integrations",
      "repositories",
      "github",
      "members",
      "workspace"
    ]
  }];
  // Only what this person did, by email; empty for everyone.
  string actor = 4 [(buf.validate.field).string.max_len = 320];
}

message ListActivityResponse {
  repeated Activity activity = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

syntax = "proto3";

package stagd.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "stagd/api/v1/compute.proto";
import "stagd/api/v1/model.proto";
import "stagd/config/v1/config.proto";

// PreviewService starts, watches and tears down preview environments.
//
// A webhook from a code host and a call to CreatePreview take the same path:
// a pull request opening on GitHub is just one more way to start a preview.
// That is what lets teams without a connected code host start previews from
// CI or the CLI.
service PreviewService {
  // CreatePreview starts a preview, or updates the existing one for the same
  // change request or branch to the new commit.
  rpc CreatePreview(CreatePreviewRequest) returns (CreatePreviewResponse);
  // ListSources lists what a repository's previews can be of, from its code
  // host: its open pull requests (not from forks: those never get
  // previews), newest first, and its branches. Only for repositories with
  // previews on: Stagd never reads the others.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  rpc GetPreview(GetPreviewRequest) returns (GetPreviewResponse);
  rpc ListPreviews(ListPreviewsRequest) returns (ListPreviewsResponse);
  // WatchPreview streams the preview's state until it is live, failed or
  // destroyed, starting with its current state.
  rpc WatchPreview(WatchPreviewRequest) returns (stream WatchPreviewResponse);
  // ListPreviewEvents returns what happened to a preview: all of it, oldest
  // first; or, with a page_size, a page at a time, newest first.
  rpc ListPreviewEvents(ListPreviewEventsRequest) returns (ListPreviewEventsResponse);
  // WakePreview starts a sleeping preview again.
  rpc WakePreview(WakePreviewRequest) returns (WakePreviewResponse);
  // DestroyPreview tears a preview down now.
  rpc DestroyPreview(DestroyPreviewRequest) returns (DestroyPreviewResponse);
  // GetPreviewPolicy returns who may open previews and how their URLs look:
  // the org's default, or a repository's (its own, or the default it inherits).
  rpc GetPreviewPolicy(GetPreviewPolicyRequest) returns (GetPreviewPolicyResponse);
  // UpdatePreviewPolicy sets the org's default, or a repository's override.
  // Access applies to existing previews on their next deploy; URL style only
  // to new previews, so links already shared keep working.
  rpc UpdatePreviewPolicy(UpdatePreviewPolicyRequest) returns (UpdatePreviewPolicyResponse);
  // ValidateApp checks a repository's stagd.yaml and compose file exactly as
  // previews read them, without starting anything (stagd validate). The
  // client sends the files it has; when stagd.yaml points at another file,
  // the response asks for it in `requested`, and the client calls again.
  rpc ValidateApp(ValidateAppRequest) returns (ValidateAppResponse);
  // ListMail lists the mail a preview captured, newest first. Only for
  // previews with mail capture on (stagd.yaml `services: { mail: {} }`) and
  // running: a sleeping preview keeps its mail, but has to wake to show it.
  rpc ListMail(ListMailRequest) returns (ListMailResponse);
  // GetMail returns one captured message with its text, HTML and headers.
  rpc GetMail(GetMailRequest) returns (GetMailResponse);
  // ClearMail deletes everything a preview captured.
  rpc ClearMail(ClearMailRequest) returns (ClearMailResponse);
  // DeleteMail deletes one message a preview captured.
  rpc DeleteMail(DeleteMailRequest) returns (DeleteMailResponse);

  // GetServiceUsage returns CPU and memory per service of a preview over a
  // window up to 24 hours. Stagd samples them every 30 seconds while a
  // preview is live, on compute that can say: nothing while it sleeps, so
  // the series have gaps.
  rpc GetServiceUsage(GetServiceUsageRequest) returns (GetServiceUsageResponse);

  // ListLogs returns the latest lines a preview's services wrote, read from
  // its compute when asked: Stagd keeps no copy. Each line is read for its
  // level and message, and JSON and logfmt lines for their fields. The
  // preview's secrets are hidden. A sleeping preview has to wake first; a
  // torn-down one's logs are gone.
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);

  // ListBuildLogs returns what each service's build printed, for those its
  // compute builds, read from the compute when asked: Stagd keeps no copy.
  // There while it builds, to follow by asking again, and after, until the
  // preview's instance goes; the preview's secrets are hidden.
  rpc ListBuildLogs(ListBuildLogsRequest) returns (ListBuildLogsResponse);

  // ListTraces lists a preview's traces, newest first, from its own
  // OpenTelemetry endpoint (stagd.yaml `services: { otel: {} }`), read when
  // asked: Stagd keeps no copy. A sleeping preview has to wake first.
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // GetTrace returns one trace's spans, for a waterfall.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
}

// Who may open a preview.
enum PreviewAccess {
  PREVIEW_ACCESS_UNSPECIFIED = 0;
  // Members of the org, signed in to Stagd. Opt-in.
  PREVIEW_ACCESS_ORG = 1;
  // Anyone with the link. The default.
  PREVIEW_ACCESS_PUBLIC = 2;
}

// PreviewPolicy is who may open previews and how their URLs look.
message PreviewPolicy {
  // A repository id or "owner/name"; empty for the org's default.
  string repository = 1;
  PreviewAccess access = 2;
  // Ingresses anyone can reach even when access is ORG, e.g. "api" for a
  // third-party webhook. Matched by ingress name.
  repeated string public_ingresses = 3;
  // Add a random token to every new preview's host, e.g.
  // pr-42-web-acme-k3x9q2m7wd. Makes URLs hard to guess; it doesn't replace
  // access control, since links get shared.
  bool unguessable_urls = 4;
  // Viewers don't see the previews' captured mail. They see it by default:
  // a sign-up or reset email is often what they're checking.
  bool hide_mail_from_viewers = 5;
  // How long a preview nobody opens stays awake before it sleeps; opening
  // it wakes it again. Unset for Stagd's default, 45 minutes, which is
  // also the least; up to 24 hours. A repository's stagd.yaml can set its own
  // (lifecycle: { sleep_after: 2h }), which wins.
  google.protobuf.Duration sleep_after = 6 [(buf.validate.field).duration = {
    gte: {seconds: 2700}
    lte: {seconds: 86400}
  }];
  // How long a preview lives without a new commit before it's torn down; a
  // new commit starts it over. Unset for Stagd's default, 24 hours; from 1
  // to 48 hours. stagd.yaml can set its own (lifecycle: { expire_after: 36h }).
  google.protobuf.Duration expire_after = 7 [(buf.validate.field).duration = {
    gte: {seconds: 3600}
    lte: {seconds: 172800}
  }];
}

// PreviewStatus follows the environment's state machine:
// queued → provisioning → building → deploying → live → sleeping → destroyed.
enum PreviewStatus {
  PREVIEW_STATUS_UNSPECIFIED = 0;
  PREVIEW_STATUS_QUEUED = 1;
  // Restoring data: a volume snapshot or a Neon branch.
  PREVIEW_STATUS_PROVISIONING = 2;
  PREVIEW_STATUS_BUILDING = 3;
  PREVIEW_STATUS_DEPLOYING = 4;
  PREVIEW_STATUS_LIVE = 5;
  // Idle; the preview URL wakes it.
  PREVIEW_STATUS_SLEEPING = 6;
  PREVIEW_STATUS_FAILED = 7;
  PREVIEW_STATUS_DESTROYED = 8;
}

// What started a preview.
enum PreviewTrigger {
  PREVIEW_TRIGGER_UNSPECIFIED = 0;
  // A code host event: a pull request opened or pushed to.
  PREVIEW_TRIGGER_WEBHOOK = 1;
  // CreatePreview, from the dashboard, the CLI, CI or an agent.
  PREVIEW_TRIGGER_API = 2;
  // A /stagd command in a pull request comment.
  PREVIEW_TRIGGER_COMMENT = 3;
}

// One part of the app: a service from the compose file.
message PreviewComponent {
  // The service name, e.g. "web", "api", "db".
  string name = 1;
  ComponentPhase phase = 2;
  // What it's doing or why it failed, e.g. "building (2/3)".
  string message = 3;
}

enum ComponentPhase {
  COMPONENT_PHASE_UNSPECIFIED = 0;
  COMPONENT_PHASE_PENDING = 1;
  COMPONENT_PHASE_BUILDING = 2;
  // Built, or nothing to build (a prebuilt or unchanged image).
  COMPONENT_PHASE_BUILT = 3;
  COMPONENT_PHASE_STARTING = 4;
  COMPONENT_PHASE_RUNNING = 5;
  COMPONENT_PHASE_FAILED = 6;
}

// A public URL into the preview. Every ingress is one DNS label under
// stagd.dev: the primary one is https://<host>.stagd.dev, the others
// https://<ingress>--<host>.stagd.dev.
message PreviewIngress {
  // Lower-case letters, digits and dashes, e.g. "web", "api", "admin".
  string name = 1;
  // The component it routes to, and its port.
  string component = 2;
  int32 port = 3;
  string url = 4;
  // The preview's main link, the one on the pull request.
  bool primary = 5;
  // Only org members, signed in to Stagd, can open it.
  bool protected = 6;
  // Set on ingresses Stagd adds for its own services: "mail" is the captured
  // mail's inbox. They're always protected.
  string builtin = 7;
}

// Where a preview's code comes from.
message PreviewSource {
  oneof kind {
    option (buf.validate.oneof).required = true;
    // A pull or merge request on the repository's code host.
    int64 change_number = 1 [(buf.validate.field).int64.gt = 0];
    // A branch. With `sha` set, that commit; else the branch's head on the
    // code host.
    string branch = 2 [(buf.validate.field).string.min_len = 1];
  }
  // Pin a commit. Required for generic repositories, where Stagd can't ask a
  // code host for the branch head.
  string sha = 3 [(buf.validate.field).string = {pattern: "^([0-9a-f]{7,40})?$"}];
}

// Preview is one preview environment.
message Preview {
  string id = 1;
  Repository repository = 2;
  // Set when the preview is for a change request.
  ChangeRequest change = 3;
  // The branch it runs.
  string branch = 4;
  // The commit it runs (or is building).
  string sha = 5;
  PreviewStatus status = 6;
  // Why it failed, in words a person can act on; set when FAILED.
  string error = 7;
  // The primary ingress's stable URL, e.g. https://pr-42-web-acme.stagd.dev.
  // Every ingress URL wakes the preview if it's asleep.
  string url = 8;
  PreviewTrigger trigger = 9;
  // Who started it: the change request's author, or the API caller.
  string started_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
  // When it will be torn down if nothing happens before.
  google.protobuf.Timestamp expire_time = 13;
  // Every public URL, the primary one first.
  repeated PreviewIngress ingresses = 14;
  // The app's parts and what each is doing.
  repeated PreviewComponent components = 15;
  // Who may open it; individual ingresses may be public (see ingresses).
  PreviewAccess access = 16;
  // stagd.yaml's comment: what someone opening the preview needs to know,
  // e.g. "Sign in with code 123456". Also on the pull request comment.
  string note = 17;
  // What a queued preview waits for before it deploys, from stagd.yaml's
  // wait: the commit's checks and how they stand, e.g. "build-images
  // (running)". Empty when it isn't waiting.
  string waiting = 18;
  // The compute it runs on: the org's default when it started, or the one
  // its stagd.yaml names (compute:). Unset once that connection is deleted.
  PreviewCompute compute = 19;
}

// PreviewCompute is the compute connection a preview runs on.
message PreviewCompute {
  string id = 1;
  // As on Settings → Compute, e.g. "kind".
  string name = 2;
  ComputeProvider provider = 3;
}

message ListSourcesRequest {
  // A repository id or "owner/name".
  string repository = 1 [(buf.validate.field).string.min_len = 1];
}

message ListSourcesResponse {
  // Open pull requests, most recently updated first; at most 100.
  repeated ChangeRequest changes = 1;
  // Branch names, the default branch first; at most 100.
  repeated string branches = 2;
}

message CreatePreviewRequest {
  // A repository id, or its "owner/name".
  string repository = 1 [(buf.validate.field).string.min_len = 1];
  PreviewSource source = 2 [(buf.validate.field).required = true];
}

message CreatePreviewResponse {
  Preview preview = 1;
}

message GetPreviewRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetPreviewResponse {
  Preview preview = 1;
}

message ListPreviewsRequest {
  // A repository id or "owner/name"; all repositories when empty.
  string repository = 1;
  // Only previews in these states; all but DESTROYED when empty.
  repeated PreviewStatus statuses = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 4;
}

message ListPreviewsResponse {
  repeated Preview previews = 1;
  string next_page_token = 2;
}

message WatchPreviewRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message WatchPreviewResponse {
  Preview preview = 1;
  // A log line or step that explains the change, e.g. "api: building (2/3)".
  string message = 2;
  // The component the message is about; empty when it's about the whole preview.
  string component = 3;
}

message WakePreviewRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message WakePreviewResponse {
  Preview preview = 1;
}

message DestroyPreviewRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DestroyPreviewResponse {
  Preview preview = 1;
}

message GetPreviewPolicyRequest {
  // A repository id or "owner/name"; empty for the org's default.
  string repository = 1;
}

message GetPreviewPolicyResponse {
  PreviewPolicy policy = 1;
  // For a repository: true when it has no override and follows the org's default.
  bool inherited = 2;
}

message UpdatePreviewPolicyRequest {
  PreviewPolicy policy = 1 [(buf.validate.field).required = true];
  // With a repository: drop its override, so it follows the org's default again.
  bool reset = 2;
}

message UpdatePreviewPolicyResponse {
  PreviewPolicy policy = 1;
  bool inherited = 2;
}

message ValidateAppRequest {
  // Root-relative path → contents, e.g. "stagd.yaml", "deploy/compose.yaml".
  map<string, string> files = 1 [(buf.validate.field).map = {
    max_pairs: 16
    values: {
      string: {max_bytes: 1048576}
    }
  }];
  // Paths the client looked for and didn't find.
  repeated string absent = 2 [(buf.validate.field).repeated.max_items = 32];
}

// One component as a preview would run it.
message AppComponent {
  string name = 1;
  // Built from this context, or
  string build_context = 2;
  // pulled as this image.
  string image = 3;
}

message ValidateAppResponse {
  // Files the server needs to answer and the client didn't send or rule out;
  // send them (or list them as absent) and call again.
  repeated string requested = 1;
  // The files the answer comes from, e.g. ["stagd.yaml", "deploy/compose.yaml"].
  repeated string files = 2;
  // Empty when previews would start; each says what to fix.
  repeated string problems = 3;
  // What a preview leaves out on purpose, e.g. bind mounts.
  repeated string notes = 4;
  repeated AppComponent components = 5;
  // Ingress names, components and ports; URLs come with a real preview.
  repeated PreviewIngress ingresses = 6;
  // stagd.yaml as previews read it, defaults filled in: unset when it has
  // problems, empty when there's no stagd.yaml.
  stagd.config.v1.Config config = 7;
}

message ListPreviewEventsRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // With a page size, events come newest first, a page at a time; without
  // one, all of them, oldest first.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the page before: the events older than it.
  string page_token = 3;
}

message PreviewEvent {
  google.protobuf.Timestamp time = 1;
  PreviewStatus status = 2;
  // The component it's about; empty for the whole preview.
  string component = 3;
  string message = 4;
}

message ListPreviewEventsResponse {
  repeated PreviewEvent events = 1;
  // Set when there are older events; empty on the last page and without a page size.
  string next_page_token = 2;
}

message ListMailRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  // At most this many, newest first; 0 means 50.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
}

message MailAddress {
  string name = 1;
  string address = 2;
}

// A captured message, without its body.
message MailSummary {
  string id = 1;
  MailAddress from = 2;
  repeated MailAddress to = 3;
  string subject = 4;
  // The start of the text, for lists.
  string snippet = 5;
  google.protobuf.Timestamp receive_time = 6;
  int64 size_bytes = 7;
}

message ListMailResponse {
  repeated MailSummary messages = 1;
  // How many the preview captured in all; `messages` may stop at `limit`.
  int32 total = 2;
}

message GetMailRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  string id = 2 [(buf.validate.field).string.min_len = 1];
}

message MailHeader {
  string name = 1;
  string value = 2;
}

message MailMessage {
  MailSummary summary = 1;
  repeated MailAddress cc = 2;
  string text = 3;
  // As the app sent it. Show it sandboxed: it's the preview's content.
  string html = 4;
  repeated MailHeader headers = 5;
}

message GetMailResponse {
  MailMessage message = 1;
}

message ClearMailRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ClearMailResponse {}

message DeleteMailRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  // The message's id, from ListMail.
  string id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteMailResponse {}

message GetServiceUsageRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  // How far back: up to 24 hours. Points are averaged into about 120 buckets.
  google.protobuf.Duration window = 2 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 86400}
  }];
}

message GetServiceUsageResponse {
  // By service name; services never sampled aren't here.
  repeated ServiceUsage services = 1;
}

// One service's CPU and memory over the window, and how it runs now.
message ServiceUsage {
  string service = 1;
  // Oldest first, one per bucket that has samples.
  repeated UsagePoint points = 2;
  // From the latest sample.
  google.protobuf.Timestamp sampled_at = 3;
  // Of one CPU: 150 is one and a half.
  double cpu_percent = 4;
  int64 memory_bytes = 5;
  // What the service may use; without a limit of its own, the machine's memory.
  int64 memory_limit_bytes = 6;
  int32 restarts = 7;
  google.protobuf.Timestamp started_at = 8;
  string image = 9;
}

// Average CPU and peak memory over one bucket of time.
message UsagePoint {
  google.protobuf.Timestamp time = 1;
  double cpu_percent = 2;
  int64 memory_bytes = 3;
}

message ListBuildLogsRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListBuildLogsResponse {
  // One per service that's built, in the order they build.
  repeated BuildLog builds = 1;
}

// BuildLog is one service's build output. Whether it's building, built or
// failed is the preview's component for the service.
message BuildLog {
  string service = 1;
  // As printed, its last 512 KB; the preview's secrets hidden.
  string text = 2;
  // There was more before; the start was left out.
  bool truncated = 3;
}

message ListLogsRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  // Only these services; all when empty.
  repeated string services = 2;
  // Lines at or after this time; as far back as kept when unset. To follow
  // a preview's logs, ask again with the last line's time.
  google.protobuf.Timestamp since = 3;
  // At most this many of the latest lines; 500 when unset.
  int32 limit = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5000
  }];
}

message ListLogsResponse {
  // Oldest first.
  repeated LogLine lines = 1;
  // There were more lines than the limit; older ones were left out.
  bool truncated = 2;
}

// How bad a line says it is.
enum LogLevel {
  // The line doesn't say.
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  // Errors, and worse: fatal, panic, critical.
  LOG_LEVEL_ERROR = 4;
}

// How a line was written.
enum LogFormat {
  // Plain text.
  LOG_FORMAT_UNSPECIFIED = 0;
  LOG_FORMAT_JSON = 1;
  LOG_FORMAT_LOGFMT = 2;
}

// One line a service wrote.
message LogLine {
  // When the engine got it.
  google.protobuf.Timestamp time = 1;
  string service = 2;
  LogLevel level = 3;
  // The message: a structured line's msg or message, a plain line whole.
  string message = 4;
  // A structured line's other keys, in the order written; nested objects
  // are dotted keys (user.id). Its time, level and message aren't here.
  repeated LogField fields = 5;
  LogFormat format = 6;
  // The line as written, secrets hidden.
  string text = 7;
}

message LogField {
  string key = 1;
  // Strings as they are, other JSON values as JSON: 1540, false, ["a"].
  string value = 2;
}

message ListTracesRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  // Only traces with spans from this service; all when empty.
  string service = 2;
  // Traces started at or after this time; the last 15 minutes when unset.
  google.protobuf.Timestamp since = 3;
  // Traces started before this time; now when unset.
  google.protobuf.Timestamp until = 4;
  // Only traces where a span failed, or the root answered 5xx.
  bool errors_only = 5;
  // Only traces that took at least this long.
  google.protobuf.Duration min_duration = 6;
  // At most this many of the newest; 100 when unset.
  int32 limit = 7 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
}

message ListTracesResponse {
  // Newest first.
  repeated TraceSummary traces = 1;
  // The services that sent traces, by name.
  repeated string services = 2;
}

// A trace for a list: its root span, how long it all took, whether anything failed.
message TraceSummary {
  string trace_id = 1;
  // The root span's name and service.
  string name = 2;
  string service = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Duration duration = 5;
  int32 span_count = 6;
  repeated string services = 7;
  bool error = 8;
  // From the root span's HTTP attributes, when it has them.
  string http_method = 9;
  int32 http_status_code = 10;
}

message GetTraceRequest {
  string preview_id = 1 [(buf.validate.field).string.min_len = 1];
  string trace_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
}

message GetTraceResponse {
  string trace_id = 1;
  // Oldest first.
  repeated Span spans = 2;
}

// What a span did.
enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_INTERNAL = 1;
  // Handled a request.
  SPAN_KIND_SERVER = 2;
  // Made a request: another service, a database.
  SPAN_KIND_CLIENT = 3;
  SPAN_KIND_PRODUCER = 4;
  SPAN_KIND_CONSUMER = 5;
}

message Span {
  string span_id = 1;
  // Empty for the root; or the caller's span outside this trace's spans.
  string parent_span_id = 2;
  string name = 3;
  string service = 4;
  SpanKind kind = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Duration duration = 7;
  bool error = 8;
  string status_message = 9;
  // Keys and values, as in a log line's fields.
  repeated LogField attributes = 10;
  repeated SpanEvent events = 11;
}

// Something a span recorded as it happened, e.g. an exception.
message SpanEvent {
  string name = 1;
  google.protobuf.Timestamp time = 2;
  repeated LogField attributes = 3;
}

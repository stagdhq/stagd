syntax = "proto3";

package stagd.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SecretService keeps the secrets previews get as variables: the org's, and
// a repository's own, which win by name. A preview's compose file uses them
// like any variable (${SESSION_SECRET}, or a bare `- SESSION_SECRET`).
// Values are encrypted at rest, and come back only as their visibility
// allows: a visible one in the list, a hidden one to an admin who reveals it,
// a write-only one never.
service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // SetSecrets creates or replaces secrets, all or none.
  rpc SetSecrets(SetSecretsRequest) returns (SetSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // RevealSecret answers a visible or hidden secret's value, and refuses a
  // write-only one. Revealing a hidden one is in the activity log.
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
  // UpdateSecretVisibility makes a secret less readable, keeping its value:
  // visible to hidden to write-only. Making it more readable takes a new
  // value, through SetSecrets, so a value set as never readable stays so.
  rpc UpdateSecretVisibility(UpdateSecretVisibilityRequest) returns (UpdateSecretVisibilityResponse);
}

// SecretVisibility is whether a secret's value can be read back.
enum SecretVisibility {
  SECRET_VISIBILITY_UNSPECIFIED = 0;
  // Shown wherever the secret is: a feature flag, a public URL.
  SECRET_VISIBILITY_VISIBLE = 1;
  // Masked, and revealed on request by an admin, in the activity log.
  SECRET_VISIBILITY_HIDDEN = 2;
  // Never read back: it can only be replaced.
  SECRET_VISIBILITY_WRITE_ONLY = 3;
}

// Secret is a secret's name, its visibility and when it last changed; its
// value only when it's visible.
message Secret {
  string name = 1;
  // "owner/name", or empty for the org's.
  string repository = 2;
  google.protobuf.Timestamp update_time = 3;
  // Who set it last, by email; empty once they're deleted.
  string updated_by = 4;
  SecretVisibility visibility = 5;
  // The value, for a visible secret only; empty otherwise.
  string value = 6;
}

message ListSecretsRequest {
  // A repository id or "owner/name"; empty for the org's own.
  string repository = 1;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
}

message SetSecretsRequest {
  // A repository id or "owner/name"; empty for the org's own.
  string repository = 1;
  map<string, string> values = 2 [(buf.validate.field).map = {
    min_pairs: 1
    max_pairs: 100
  }];
  // The visibility of every secret set. Unspecified keeps a secret's own, and
  // makes a new one hidden.
  SecretVisibility visibility = 3 [(buf.validate.field).enum.defined_only = true];
}

message SetSecretsResponse {
  repeated Secret secrets = 1;
  // Secrets too short to be masked in logs: Stagd can't redact them from
  // build and start output it shows.
  repeated string unmasked = 2;
}

message DeleteSecretRequest {
  string repository = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecretResponse {}

message RevealSecretRequest {
  // A repository id or "owner/name"; empty for the org's own.
  string repository = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

message RevealSecretResponse {
  string value = 1;
}

message UpdateSecretVisibilityRequest {
  // A repository id or "owner/name"; empty for the org's own.
  string repository = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
  SecretVisibility visibility = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message UpdateSecretVisibilityResponse {
  Secret secret = 1;
}

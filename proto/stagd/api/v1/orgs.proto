syntax = "proto3";

package stagd.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "stagd/api/v1/model.proto";

// OrgService creates orgs and moves between them. Every other service acts in
// the session's active org.
service OrgService {
  // CreateOrg creates an org with the caller as its owner, an admin, and makes it the
  // session's active org. Refused with FAILED_PRECONDITION when the server
  // runs one org that exists already, or lets each person create only one
  // and the caller has.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // ListOrgs lists the orgs the caller belongs to.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  // SwitchOrg makes another of the caller's orgs the active one for this
  // session.
  rpc SwitchOrg(SwitchOrgRequest) returns (SwitchOrgResponse);
  // ListMembers lists the people in the active org.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // UpdateMemberRole changes someone's role. The last admin can't be
  // demoted: make someone else an admin first. Nor can the owner: they hand
  // the org on first (TransferOwnership).
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  // RemoveMember takes someone out of the active org and ends their sessions
  // in it. The last admin can't be removed, nor the owner.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // TransferOwnership hands the org to another of its admins, who becomes
  // its owner; the caller, its owner until then, stays an admin. Owner only.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  // DeleteOrg deletes the active org and everything Stagd keeps for it.
  // The owner only, with the org's slug typed as confirmation. The org is gone
  // for its members at once, its previews are stopped and its members told
  // by email. 30 days later its connections, repositories, secrets, seeds
  // and activity are deleted, and Stagd's GitHub App is uninstalled from its
  // GitHub accounts; until then Stagd's support can restore it. Backups keep
  // it until they age out (90 days).
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  // UpdateOrg changes the active org's name, admins only. Its slug stays:
  // it's in links and the CLI's commands.
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  // GetOnboarding is the active org's way to its first live preview, worked
  // out from what Stagd knows: the dashboard's Home, stagd setup and the MCP
  // server's onboarding_status all read it, so they can't disagree.
  rpc GetOnboarding(GetOnboardingRequest) returns (GetOnboardingResponse);
  // DismissOnboarding hides the steps for everyone in the org. Admins only.
  rpc DismissOnboarding(DismissOnboardingRequest) returns (DismissOnboardingResponse);
}

// InviteService brings people into the active org: invites by email or by
// code-host username, and one invite link. Accepting happens in the browser,
// at /join/<token>, or on its own when someone signs in with an invited
// email or username.
service InviteService {
  // CreateInvites invites people with a role. Emails get a message with a
  // link; usernames join when they next sign in with that account.
  rpc CreateInvites(CreateInvitesRequest) returns (CreateInvitesResponse);
  // ListInvites lists the invites not yet accepted, revoked or expired.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // ResendInvite sends the invite again with a new link and a new expiry.
  rpc ResendInvite(ResendInviteRequest) returns (ResendInviteResponse);
  // RevokeInvite cancels an invite; its link stops working.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // GetInviteLink returns the org's invite link; none while it's off (the
  // default) or expired. The link is only shown to admins.
  rpc GetInviteLink(GetInviteLinkRequest) returns (GetInviteLinkResponse);
  // ResetInviteLink turns the invite link on, or replaces it, optionally with
  // another role; an old one stops working.
  rpc ResetInviteLink(ResetInviteLinkRequest) returns (ResetInviteLinkResponse);
  // DisableInviteLink turns the invite link off; it stops working.
  rpc DisableInviteLink(DisableInviteLinkRequest) returns (DisableInviteLinkResponse);
}

// What someone may do in an org. One of its admins is also its owner
// (Member.owner, Membership.owner): the one who may delete it or hand it on.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Everything, members and settings included.
  ROLE_ADMIN = 1;
  // Previews: deploy, tear down, read; no settings.
  ROLE_MEMBER = 2;
  // Opens the workspace's previews, and reads their captured mail unless the
  // preview access policy hides it; no dashboard beyond the list of
  // previews. For people who review rather than build: product, design,
  // QA. They sign in with a code by email; no code-host account needed.
  ROLE_VIEWER = 3;
}

message CreateOrgRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Lower-case letters, digits and dashes, e.g. "acme". Must be free.
  string slug = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 39
    pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
  }];
}

message CreateOrgResponse {
  Membership membership = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  // The session's active org; unset when the caller has none.
  string active_org_id = 1;
  repeated Membership memberships = 2;
}

message SwitchOrgRequest {
  // A slug of an org the caller belongs to.
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}

message SwitchOrgResponse {
  Membership active = 1;
}

message ListMembersRequest {}

message Member {
  User user = 1;
  // "admin", "member" or "viewer"; kept as text for older clients.
  string role = 2;
  Role role_kind = 3;
  // How they joined: "created" (made the org), "invite", "link", "server"
  // (a single-org server lets everyone in).
  string joined_via = 4;
  google.protobuf.Timestamp joined_at = 5;
  // Their last request in this org; unset when unknown.
  google.protobuf.Timestamp last_active_at = 6;
  // Their code-host login, e.g. GitHub's, when they have one.
  string login = 7;
  // The org's owner: an admin who also may delete the org or hand it on.
  // Exactly one member is.
  bool owner = 8;
}

message UpdateMemberRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  Role role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message UpdateMemberRoleResponse {
  Member member = 1;
}

message TransferOwnershipRequest {
  // An admin of the org, who becomes its owner.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message TransferOwnershipResponse {}

message RemoveMemberRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RemoveMemberResponse {}

// Why an org is deleted, to learn from; optional.
enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_TOO_EXPENSIVE = 1;
  LEAVE_REASON_MISSING_FEATURE = 2;
  LEAVE_REASON_HARD_TO_SET_UP = 3;
  LEAVE_REASON_OTHER_TOOL = 4;
  LEAVE_REASON_JUST_TRYING = 5;
  LEAVE_REASON_OTHER = 6;
}

message DeleteOrgRequest {
  // The active org's slug, typed again: it must match.
  string slug = 1 [(buf.validate.field).string.min_len = 1];
  LeaveReason reason = 2;
  // In the person's own words; kept by Stagd without any of the org's data.
  string reason_text = 3 [(buf.validate.field).string.max_len = 2000];
}

message DeleteOrgResponse {
  // Compute connections whose relay or access is still installed on the
  // customer's side, which Stagd can't remove itself: by name, for the
  // person to uninstall (stagd compute uninstall, or deleting the manifest).
  repeated string compute = 1;
}

message UpdateOrgRequest {
  // The org's new name, e.g. "Acme Inc"; trimmed.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message UpdateOrgResponse {
  // The caller's membership in the org, with its new name.
  Membership membership = 1;
}

message CreateInvitesRequest {
  // Emails, or code-host usernames (GitHub's, with or without @).
  repeated string invitees = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
  Role role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message CreateInvitesResponse {
  repeated Invite invites = 1;
  // Invitees that weren't invited, and why: already a member, not an email
  // or a username.
  repeated InviteProblem problems = 2;
}

message InviteProblem {
  string invitee = 1;
  string reason = 2;
}

message Invite {
  string id = 1;
  // One of the two.
  string email = 2;
  string login = 3;
  Role role = 4;
  User invited_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // The invite's own link, only in CreateInvites' and ResendInvite's answers:
  // to send by hand when the server sends no email, or for a username.
  string url = 8;
  // An email went out with the link.
  bool emailed = 9;
}

message ListInvitesRequest {}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message ResendInviteRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ResendInviteResponse {
  Invite invite = 1;
}

message RevokeInviteRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RevokeInviteResponse {}

message InviteLink {
  string url = 1;
  Role role = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetInviteLinkRequest {}

message GetInviteLinkResponse {
  // Unset while the link is off.
  InviteLink link = 1;
}

message ResetInviteLinkRequest {
  // The role people join with; the current one when unset.
  Role role = 1 [(buf.validate.field).enum.defined_only = true];
}

message ResetInviteLinkResponse {
  InviteLink link = 1;
}

message DisableInviteLinkRequest {}

message DisableInviteLinkResponse {}

message ListMembersResponse {
  repeated Member members = 1;
}

// OnboardingStep is one step on the way to the first live preview.
message OnboardingStep {
  // "github", "repositories", "compute", "secrets", "first_preview",
  // "describe" or "invite"; clients may show steps they don't know by title.
  string id = 1;
  string title = 2;
  bool done = 3;
  // Doesn't hold the way open, e.g. inviting the team; listed after the
  // required steps.
  bool optional = 4;
  // Only an admin can do it; others wait for one (Onboarding.admins).
  bool admin_only = 5;
  // Done: what was set up, e.g. "acme-inc on GitHub". Not done: what's
  // missing or how, in a sentence.
  string detail = 6;
  // Where it's done or seen, in the dashboard.
  string url = 7;
  // Done because there's nothing to do, e.g. no secrets the app needs.
  bool skipped = 8;
}

message Onboarding {
  // The steps in order: the required ones, then the optional ones.
  repeated OnboardingStep steps = 1;
  // How many required steps are done, of how many.
  int32 done = 2;
  int32 required = 3;
  // The id of the first required step not done; empty when all are.
  string next = 4;
  // When the org's first preview went live; unset until then.
  google.protobuf.Timestamp complete_time = 5;
  // When an admin dismissed it, and who; unset until then.
  google.protobuf.Timestamp dismiss_time = 6;
  string dismissed_by = 7;
  // Its admins, for others waiting on an admin step.
  repeated User admins = 8;
}

message GetOnboardingRequest {}

message GetOnboardingResponse {
  Onboarding onboarding = 1;
}

message DismissOnboardingRequest {}

message DismissOnboardingResponse {
  Onboarding onboarding = 1;
}

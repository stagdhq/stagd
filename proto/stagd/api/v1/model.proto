syntax = "proto3";

package stagd.api.v1;

import "google/protobuf/timestamp.proto";

// The public Stagd API. The dashboard, the CLI, CI jobs and coding agents all
// call these services as the signed-in person, with that person's rights and
// no more. The org a call acts in comes from the session, never from a
// request.
//
// Nothing in the core model is specific to GitHub: a repository belongs to a
// code host (GitHub first, others later, or none at all when previews are
// started from CI or the CLI), and a change request is a GitHub pull request
// or a GitLab merge request alike.

// User is someone who can sign in.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string image_url = 4;
}

// Preferences are how Stagd looks and behaves for one person, in every org.
message Preferences {
  Theme theme = 1;
  // An IANA time zone, e.g. "Europe/Oslo"; empty follows the browser.
  string time_zone = 2;
  // No animated build bars or live pulses.
  bool reduce_motion = 3;
}

enum Theme {
  // Follows the operating system.
  THEME_UNSPECIFIED = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
}

// Org is one customer account. It belongs to Stagd and is not the same thing
// as a GitHub organization: one Stagd org can connect several GitHub
// accounts, and later other code hosts.
message Org {
  string id = 1;
  // Human name for URLs and the CLI, e.g. "acme".
  string slug = 2;
  string name = 3;
  google.protobuf.Timestamp create_time = 4;
}

// Membership is a user's place in one org.
message Membership {
  Org org = 1;
  // admin | member | viewer ("owner" from servers before roles; read it as admin)
  string role = 2;
}

// ScmProvider is the code host a repository lives on.
enum ScmProvider {
  SCM_PROVIDER_UNSPECIFIED = 0;
  SCM_PROVIDER_GITHUB = 1;
  // Planned.
  SCM_PROVIDER_GITLAB = 2;
  // Planned.
  SCM_PROVIDER_BITBUCKET = 3;
  // No code host integration: previews are started from CI or the CLI, and
  // source comes as an uploaded archive or a prebuilt image.
  SCM_PROVIDER_GENERIC = 4;
}

// Repository is a repository Stagd can build previews for.
message Repository {
  string id = 1;
  // The connection it was reached through; empty for generic repositories.
  string connection_id = 2;
  ScmProvider provider = 3;
  // "owner/name" on the code host, or a name chosen for a generic repository.
  string full_name = 4;
  // The code host's own id for the repository.
  string external_id = 5;
  string default_branch = 6;
  bool private = 7;
  // Link to the repository on the code host.
  string url = 8;
  // Previews are opt-in per repository: until they're enabled, Stagd ignores
  // its pull requests and never reads its code.
  bool previews_enabled = 9;
  // How the app is described on the default branch, as previews would read
  // it; unset until Stagd has looked, and never while previews are off.
  RepositorySetup setup = 10;
  // Hidden by an org admin: left out of the lists (repositories, the
  // new-preview picker, the command palette) unless asked for. Only the
  // lists: previews carry on as they are.
  bool hidden = 11;
}

// RepositorySetup is what Stagd found on a repository's default branch:
// whether it has a stagd.yaml, the compose file it reads, and what would
// stop a preview, the same check as stagd validate.
message RepositorySetup {
  // "stagd.yaml" or ".stagd.yaml"; empty when the repository has none and
  // Stagd reads the compose file alone.
  string config_file = 1;
  // The compose file, e.g. "compose.yaml" or "deploy/compose.preview.yaml";
  // empty when none was found.
  string compose_file = 2;
  // The URLs previews get, by ingress name, the primary one first.
  repeated string ingresses = 3;
  // What would stop a preview, in words a person can act on; empty when it would deploy.
  repeated string problems = 4;
  // A stagd.yaml to start from, made from what was found; set when the
  // repository has none.
  string starter = 5;
  google.protobuf.Timestamp check_time = 6;
}

// ChangeRequest is a GitHub pull request or a GitLab merge request.
message ChangeRequest {
  int64 number = 1;
  string title = 2;
  // The branch with the changes.
  string head_ref = 3;
  string head_sha = 4;
  // The branch it merges into.
  string base_ref = 5;
  // The author's login on the code host.
  string author = 6;
  string url = 7;
}

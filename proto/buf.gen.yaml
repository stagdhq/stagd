# Go for the protos in proto/, into internal/gen, and stagd.yaml's JSON
# Schema (from stagd.config.v1.Config) into schema/. Run
# `task generate` from the repository's root (where out paths start);
# never edit generated code by hand.
version: v2
clean: true
inputs:
  - directory: proto
managed:
  enabled: true
  disable:
    # Use protovalidate's published Go package instead of generating our own copy.
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/stagdhq/stagd/internal/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "run", "./internal/configschema/protoc-gen-stagd-schema"]
    out: schema
    strategy: all

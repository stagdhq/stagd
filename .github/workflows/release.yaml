# A release, on a v* tag: stagd for macOS, Linux and Windows (amd64,
# arm64), install.sh, install.ps1 and checksums.txt, attached to the tag's GitHub release (go
# tool task dist) with notes from its commits (scripts/release-notes.sh),
# then the Homebrew cask in stagdhq/homebrew-tap, and the release
# installed on Linux, macOS and Windows as users do.
# curl -fsSL https://stagd.dev/install.sh | bash, brew install
# stagdhq/tap/stagd and stagd update all install from here.
#
# Needs secrets.HOMEBREW_TAP_TOKEN, a fine-grained token with Contents:
# write on stagdhq/homebrew-tap; without it, the cask isn't updated.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # git describe names the version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go tool task dist

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes, from the tag's message and the commits since the last tag.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: The Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN: the cask in stagdhq/homebrew-tap stays as it was"
            exit 0
          fi

          git clone "https://x-access-token:$TAP_TOKEN@github.com/stagdhq/homebrew-tap.git" tap
          mkdir -p tap/Casks
          scripts/homebrew.sh "$GITHUB_REF_NAME" dist/checksums.txt > tap/Casks/stagd.rb

          cd tap
          git config user.name "stagd release"
          git config user.email "release@stagd.dev"

          # A cask now, not a formula: Homebrew wants current Command Line Tools for a formula without a bottle.
          git rm -q --ignore-unmatch Formula/stagd.rb
          git add Casks/stagd.rb
          git commit -m "stagd $GITHUB_REF_NAME"
          git push

  # The release just made, installed the way users do, on each kind of
  # machine: install.sh on Linux and macOS, install.ps1 on Windows (Windows
  # PowerShell 5.1, then PowerShell 7 over it).
  verify:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          STAGD_VERSION: ${{ github.ref_name }}
        run: |
          curl -fsSL https://stagd.dev/install.sh | bash
          "$HOME/.local/bin/stagd" --version | grep -F "$STAGD_VERSION"

      - name: install.ps1, Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STAGD_VERSION: ${{ github.ref_name }}
        run: |
          irm https://stagd.dev/install.ps1 | iex
          $v = stagd --version
          if ($v -notmatch [regex]::Escape($env:STAGD_VERSION)) { throw "installed: $v" }

      - name: install.ps1 again, PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STAGD_VERSION: ${{ github.ref_name }}
        run: |
          irm https://stagd.dev/install.ps1 | iex
          $v = stagd --version
          if ($v -notmatch [regex]::Escape($env:STAGD_VERSION)) { throw "installed: $v" }
